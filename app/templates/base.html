<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="theme-color" content="#1a5276">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v=asset_version) }}">
  <script src="{{ url_for('static', filename='js/boot.js', v=asset_version) }}"></script>
  <script src="{{ url_for('static', filename='js/app.js', v=asset_version) }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Үндсэн агуулга руу очих</a>
  {% include "partials/navbar.html" %}

  <main id="main" class="container{% block container_class %}{% endblock %}" tabindex="-1">
    {% include "partials/flashes.html" %}
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer__inner">© {{ current_year }} {{ site_name }}</div>
  </footer>
</body>
</html>
